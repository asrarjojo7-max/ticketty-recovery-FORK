x-backend-environment: &backend-environment
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_ISSUER: ${JWT_ISSUER:-ticketty-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ticketty-web}
  WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
  # Client → Cloudflare edge → cloudflared (localhost, proxy #1) → web/BFF.
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  ACCOUNTING_WORKER_ENABLED: ${ACCOUNTING_WORKER_ENABLED:-true}
  ACCOUNTING_WORKER_INTERVAL_MS: ${ACCOUNTING_WORKER_INTERVAL_MS:-5000}
  SUBSCRIPTION_SWEEP_ENABLED: ${SUBSCRIPTION_SWEEP_ENABLED:-true}
  SUBSCRIPTION_SWEEP_INTERVAL_MS: ${SUBSCRIPTION_SWEEP_INTERVAL_MS:-21600000}
  PILOT_PAYMENT_MODE: CASH
  PORT: 3001
  API_BIND_HOST: 0.0.0.0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketty}
      POSTGRES_USER: ${POSTGRES_USER:-ticketty_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ticketty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  migrate:
    build:
      context: ./backend
    restart: "no"
    environment:
      <<: *backend-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?RUNTIME_DATABASE_PASSWORD is required}
      MONITORING_DATABASE_PASSWORD: ${MONITORING_DATABASE_PASSWORD:?MONITORING_DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    # TD-016 deploy-time enforcement: النشر نفسه يفشل إذا سقطت
    # القيود/RLS/triggers/grants — migrate deploy ثم الفحص الشامل.
    # السلسلة شرطية: الفحص يفشل = الحاوية تفشل = backend لا يبدأ
    # (service_completed_successfully).
    command:
      [
        "sh",
        "-c",
        "pnpm exec prisma migrate deploy && pnpm db:provision-runtime && pnpm db:provision-monitoring && pnpm test:db:invariants",
      ]

  backend:
    build:
      context: ./backend
    # Controlled-pilot singleton: container_name intentionally prevents
    # accidental `docker compose up --scale backend=N` while in-process
    # accounting/subscription workers are enabled.
    container_name: ticketty-backend-singleton-worker
    restart: unless-stopped
    environment:
      <<: *backend-environment
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?RUNTIME_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/liveness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:3001/api
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alert-rules.yml:/etc/prometheus/rules/ticketty.yml:ro
      - ticketty-prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_WEBHOOK_URL_FILE:-/etc/ticketty/alertmanager-webhook-url}:/run/secrets/alertmanager_webhook_url:ro
      - ${TELEGRAM_ALERT_WEBHOOK_TOKEN_FILE:-/etc/ticketty/telegram-alert-webhook-token}:/run/secrets/telegram_alert_webhook_token:ro
      - ticketty-alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/ticketty/metrics}:/textfile:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./ops/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  telegram-assistant:
    build:
      context: ./ops/telegram-assistant
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_PAIRING_CODE: ${TELEGRAM_PAIRING_CODE:-}
      TELEGRAM_ALERT_WEBHOOK_TOKEN_FILE: /run/secrets/telegram_alert_webhook_token
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      TELEGRAM_PORT: 8090
      TELEGRAM_STATE_FILE: /var/lib/ticketty/telegram/state.json
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-15000}
    depends_on:
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    expose:
      - "8090"
    volumes:
      - ticketty-telegram:/var/lib/ticketty/telegram
      - ${TELEGRAM_ALERT_WEBHOOK_TOKEN_FILE:-/etc/ticketty/telegram-alert-webhook-token}:/run/secrets/telegram_alert_webhook_token:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  ticketty-postgres:
  ticketty-prometheus:
  ticketty-alertmanager:
  ticketty-telegram:
