services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketty}
      POSTGRES_USER: ${POSTGRES_USER:-ticketty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ticketty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  migrate:
    build:
      context: ./backend
    restart: "no"
    environment: &backend-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ticketty}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ticketty}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-ticketty-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ticketty-web}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      ACCOUNTING_WORKER_ENABLED: ${ACCOUNTING_WORKER_ENABLED:-true}
      ACCOUNTING_WORKER_INTERVAL_MS: ${ACCOUNTING_WORKER_INTERVAL_MS:-5000}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/liveness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:3001/api
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

volumes:
  ticketty-postgres:
