name: Refresh dependency lockfiles

on:
  push:
    branches:
      - fix/pos-recent-trips-visibility

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-{{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${'{'}{ github.ref_name }}
          token: ${'{'}{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate backend lockfile
        working-directory: backend
        run: pnpm install --no-frozen-lockfile
      - name: Regenerate web lockfile
        working-directory: web
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- backend/pnpm-lock.yaml web/pnpm-lock.yaml; then
            echo "Lockfiles already match package configuration."
            exit 0
          fi
          git add backend/pnpm-lock.yaml web/pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfiles"
          git push origin "HEAD:${'{'}{ github.ref_name }}"
