name: Temporary backend lockfile refresh

on:
  push:
    branches:
      - fix/pos-recent-trips-visibility

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pos-recent-trips-visibility
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Regenerate backend lockfile
        working-directory: backend
        run: pnpm install --no-frozen-lockfile
      - name: Verify production audit
        working-directory: backend
        run: pnpm audit --prod
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pnpm-lock.yaml
          git commit -m "fix: refresh backend lockfile with patched dependencies"
          git push origin HEAD:fix/pos-recent-trips-visibility
