name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      RUNTIME_DATABASE_PASSWORD: ci-runtime-password-with-at-least-32-characters
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: ticketty-api
      JWT_AUDIENCE: ticketty-web
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test:cov --runInBand
      - run: pnpm build
      - run: pnpm audit --prod

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketty
          POSTGRES_USER: ticketty
          POSTGRES_PASSWORD: ticketty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketty -d ticketty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      RUNTIME_DATABASE_PASSWORD: ci-runtime-password-with-at-least-32-characters
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: ticketty-api
      JWT_AUDIENCE: ticketty-web
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:provision-runtime
      # Backend E2E relies on the canonical platform-operator fixture.
      # Seed only this isolated CI database before running the integration suite.
      - name: Seed backend E2E operator
        run: pnpm db:seed
        env:
          INITIAL_ADMIN_EMAIL: e2e-owner@ticketty.local
          INITIAL_ADMIN_PASSWORD: E2eTest-Passw0rd-2026
          INITIAL_ORG_NAME: Ticketty
          INITIAL_ORG_SLUG: ticketty
      - run: pnpm test:e2e --runInBand
      # TD-016: المظلة الشاملة أولاً — أي قيد/RLS/trigger/grant يسقط
      # يفشل البناء هنا قبل الفحوص الفردية (استبدال "تذكر" بآلة).
      - run: pnpm test:db:invariants
      - run: pnpm test:db:refund-integrity
      - run: pnpm test:db:tenant-consistency
      - run: pnpm test:db:settlement-integrity
      - run: pnpm test:db:accounting-integrity
      - run: pnpm test:db:trip-overlap

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      API_BASE_URL: http://127.0.0.1:3001/api
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm build
      - run: pnpm audit --prod

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketty
          POSTGRES_USER: ticketty
          POSTGRES_PASSWORD: ticketty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketty -d ticketty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Backend
      DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      RUNTIME_DATABASE_PASSWORD: ci-runtime-password-with-at-least-32-characters
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: ticketty-api
      JWT_AUDIENCE: ticketty-web
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
      # Web (BFF proxies to the backend)
      API_BASE_URL: http://127.0.0.1:4000/api
      APP_ORIGIN: http://localhost:3000
      # Bootstrap fixtures (db:seed creates org/roles/admin)
      INITIAL_ADMIN_EMAIL: admin@ticketty.local
      INITIAL_ADMIN_PASSWORD: ci-only-admin-password
      INITIAL_ORG_NAME: Ticketty
      INITIAL_ORG_SLUG: ticketty
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install backend deps and migrate
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm db:provision-runtime
        working-directory: backend
      - name: Seed org, roles, admin and demo data
        run: |
          pnpm db:seed
          pnpm db:seed-demo
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      - name: Build backend
        run: pnpm build
        working-directory: backend
      - name: Start backend with least-privilege identity
        run: |
          nohup node dist/main > /tmp/backend.log 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:4000/api/health/liveness
        working-directory: backend
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ticketty_runtime:ci-runtime-password-with-at-least-32-characters@127.0.0.1:5432/ticketty
          WEB_ORIGIN: https://ticketty.example.test
          ACCOUNTING_WORKER_ENABLED: "false"
          SUBSCRIPTION_SWEEP_ENABLED: "false"
      - name: Build and start web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &
          sleep 5
          curl -fsS -o /dev/null http://localhost:3000/
        working-directory: web
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: web
      - name: Provision E2E fixtures
        run: pnpm e2e:setup
        working-directory: web
      - name: Run golden-path specs
        run: pnpm e2e:web
        working-directory: web
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  telegram-assistant-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Telegram assistant
        run: |
          node --check ops/telegram-assistant/server.mjs
          node --test ops/telegram-assistant/core.test.mjs
      - name: Build Telegram assistant image
        run: docker build --file ops/telegram-assistant/Dockerfile --tag ticketty-telegram-assistant:ci ops/telegram-assistant

  container-builds:
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-integration, web-quality, web-e2e, telegram-assistant-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file backend/Dockerfile --tag ticketty-backend:ci backend
      - run: docker build --file web/Dockerfile --tag ticketty-web:ci web
