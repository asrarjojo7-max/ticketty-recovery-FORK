global:
  resolve_timeout: 5m

route:
  receiver: ticketty-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ticketty-operations
      matchers:
        - severity=~"critical|warning"
      continue: false

receivers:
  - name: ticketty-operations
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
