# Ticketty controlled-pilot production alert rules.
# Application thresholds are anchored to the measured 2026-09-12 baseline
# (dashboard p95 333ms, API RSS ~155MiB). Host thresholds are sustained
# saturation signals, not one-off spikes. Prometheus and Alertmanager are
# private services configured under ops/monitoring/.
groups:
  - name: ticketty-backend-critical
    rules:
      # العامل المحاسبي توقف — "إذا توقف العامل نعرف تلقائيًا".
      # staleness: آخر نجاح أقدم من 3× فترة التشغيل (interval 5s →
      # عمليًا نستخدم 15 دقيقة كأفق أقصى مراعاة لحالات الخمول الطويل
      # بلا أحداث — العامل يحدّث الطابع الزمني كل دورة بكل الأحوال).
      - alert: AccountingWorkerStale
        expr: |
          (time() - ticketty_accounting_worker_last_success_timestamp_seconds) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "عامل المحاسبة متوقف (لم يُكمل دورة ناجحة منذ >15 دقيقة)"
          description: >
            آخر دورة ناجحة للعامل المحاسبي تجاوزت 15 دقيقة. الأحداث
            المحاسبية (عمولات/تسويات/قيم) تتوقف عن الترحيل — تحقق من
            DB connectivity و ACCOUNTING_WORKER_ENABLED.

      # فشل متكرر — "الفشل المتكرر نعرف تلقائيًا".
      - alert: AccountingWorkerFailing
        expr: ticketty_accounting_worker_consecutive_failures > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "العامل المحاسبي يفشل باستمرار منذ 10 دقائق"
          description: >
            دورات العامل ترمي استثناءات (claim/DB) — ليست أحداث أعمال
            فاشلة بل عطل تشغيلي. راجع logs.

      # أحداث أعمال فاشلة (failed processing) — حرج مالي.
      - alert: AccountingEventsFailing
        expr: increase(ticketty_accounting_events_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "أحداث محاسبية فشلت خلال آخر 10 دقائق"
          description: >
            أحداث أعمال (BOOKING_SALE وغيرها) فشلت معالجتها — راجع
            الحدث في accounting_events.status=FAILED لمعرفة السبب.

      # طابور يتراكم — العامل لا يواكب.
      - alert: AccountingQueueBacklog
        expr: ticketty_accounting_queue_depth{status="PENDING"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "طابور المحاسبة يتجاوز 100 حدث معلق منذ 15 دقيقة"
          description: >
            العامل لا يواكب الإنتاج — راجع interval وقدرة المعالجة
            أو ابحث عن أحداث عالقة (claim بلا معالجة).

      # أحداث عالقة قديمة (stale) — أقوى مؤشر على عطل صامت.
      - alert: AccountingStalePending
        expr: ticketty_accounting_queue_depth{status="PENDING"} > 0
          and on() (time() - ticketty_accounting_worker_last_success_timestamp_seconds) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "أحداث معلقة + عامل متوقف — تراكم صامت"
          description: >
            PENDING > 0 مع عامل لم ينجح منذ >5 دقائق = الأحداث لا
            تعالج إطلاقاً. تدخل فوري.

      # سحّال الاشتراكات توقف (Phase 1 worker) — منظمة قد تبقى
      # EXPIRED بلا تحديث أو تجديدات لا تُفعّل.
      - alert: SubscriptionSweepStale
        expr: |
          (time() - ticketty_subscription_sweep_last_run_timestamp_seconds) > 21600
        labels:
          severity: warning
        annotations:
          summary: "سحّال الاشتراكات لم يعمل منذ >6 ساعات"
          description: >
            الفترة الافتراضية 6 ساعات — تجاوزها يعني توقف السحّال
            (تراكم منتهيات بلا انتقال حالة).

      - alert: SubscriptionSweepErroring
        expr: ticketty_subscription_sweep_last_result == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "آخر سحبة اشتراكات فشلت"
          description: >
            آخر تشغيل للسحّال انتهى بخطأ — راجع logs.

      # 402s ترتفع — منظمة نشطة تجاريًا انتهى اشتراكها (فرصة
      # مبيعات + إشارة صحة).
      - alert: SubscriptionBlocksSurge
        expr: increase(ticketty_subscription_blocks_total[1h]) > 50
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "موجة 402 (اشتراكات منتهية) — >50 خلال ساعة"
          description: >
            منظمة نشطة تُحجب عن البيع — فرصة متابعة تجارية فورية.

      # معدل أخطاء 5xx.
      - alert: Backend5xxRate
        expr: |
          sum(rate(ticketty_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ticketty_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "معدل 5xx يتجاوز 5% منذ 10 دقائق"
          description: >
            نسبة أخطاء الخادم مرتفعة — راجع logs و requestId trail.

      - alert: AuthenticationFailureSurge
        expr: |
          sum(increase(ticketty_http_requests_total{route="/api/auth/login",status=~"401|429"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ارتفاع محاولات الدخول الفاشلة"
          description: "أكثر من 20 استجابة 401/429 على تسجيل الدخول خلال خمس دقائق."

      - alert: BackendEventLoopLag
        expr: ticketty_process_nodejs_eventloop_lag_p99_seconds > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "تأخر event loop في الـ backend"
          description: "p99 event-loop lag تجاوز 250ms لعشر دقائق؛ افحص CPU والعمليات المكلفة."

      - alert: BackendMemoryPressure
        expr: ticketty_process_process_resident_memory_bytes > 1610612736
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ذاكرة backend تتجاوز 1.5 GiB"
          description: "اضبط العتبة وفق حد الحاوية الفعلي قبل النشر."

      # Process/scrape availability. Database-specific failure is also detected
      # independently by worker-watchdog.sh and the readiness endpoint.
      - alert: ApplicationDown
        expr: up{job="ticketty-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "الـ backend غير قابل للوصول"
          description: >
            فشل scrape — إما العملية أو الشبكة؛ راجع /api/health/liveness.

      - alert: WebApplicationDown
        expr: probe_success{job="ticketty-web"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "واجهة Ticketty غير متاحة"
          description: "فشل فحص HTTP الداخلي لنقطة liveness الخاصة بالويب."

      - alert: ApplicationFlapping
        expr: changes(up{job=~"ticketty-backend|ticketty-web"}[15m]) > 4
        labels:
          severity: warning
        annotations:
          summary: "خدمة Ticketty تتذبذب بين العمل والتوقف"
          description: "تغيرت حالة availability أكثر من أربع مرات خلال 15 دقيقة."

      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ticketty_http_request_duration_seconds_bucket[5m]))) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "زمن استجابة backend مرتفع"
          description: "p95 تجاوز 750ms لعشر دقائق؛ baseline المحلي المقاس كان 333ms للمسار الأبطأ."

      - alert: BackendRepeatedRestarts
        expr: changes(ticketty_process_process_start_time_seconds[15m]) > 2
        labels:
          severity: critical
        annotations:
          summary: "الـ backend يعيد التشغيل بصورة متكررة"
          description: "تغير وقت بدء العملية أكثر من مرتين خلال 15 دقيقة."

  - name: ticketty-database
    rules:
      - alert: DatabaseExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "مراقبة PostgreSQL غير متاحة"
          description: "تعذر الوصول إلى postgres-exporter؛ تحقق من قاعدة البيانات واعتماد المراقبة الخاص."

      - alert: DatabaseConnectionsNearLimit
        expr: sum(pg_stat_database_numbackends) / scalar(pg_settings_max_connections) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "اتصالات PostgreSQL تقترب من الحد"
          description: "أكثر من 80% من max_connections مستخدم لعشر دقائق."

      - alert: DatabaseDeadlocks
        expr: sum(increase(pg_stat_database_deadlocks[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL سجل deadlock"
          description: "ظهر deadlock واحد على الأقل خلال 15 دقيقة؛ راجع المعاملات والسجلات المرتبطة."

  - name: ticketty-backup
    rules:
      - alert: BackupLastRunFailed
        expr: ticketty_backup_last_result == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "آخر نسخة Ticketty الاحتياطية فشلت"
          description: "تحقق من سجل backup-nightly ومن توفر وجهة Google Drive الخارجية."

      - alert: BackupStale
        expr: time() - ticketty_backup_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "آخر نسخة احتياطية أقدم من 25 ساعة"
          description: "RPO اليومي مهدد؛ افحص الجدولة والوجهة الخارجية فورًا."

  - name: ticketty-infrastructure
    rules:
      - alert: HostHighCpu
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "استخدام CPU مرتفع"
          description: "استخدام CPU تجاوز 85% لمدة 15 دقيقة."

      - alert: HostHighMemory
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "استخدام الذاكرة مرتفع"
          description: "استخدام الذاكرة تجاوز 85% لمدة 15 دقيقة."

      - alert: HostDiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "المساحة الحرة أقل من 15%"
          description: "أحد أنظمة الملفات الدائمة يقترب من الامتلاء."

      - alert: HostFilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "نظام ملفات دائم أصبح للقراءة فقط"
          description: "توقف الكتابة يهدد PostgreSQL والنسخ الاحتياطي والسجلات."
